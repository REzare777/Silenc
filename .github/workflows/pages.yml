name: Публикация игры на GitHub Pages

# Каждый push в main собирает игру и обновляет публичную ветку gh-pages:
# https://rezare777.github.io/Silenc/
#
# ВАЖНО: в репозитории GitHub → Settings → Pages → Source должно стоять
# "Deploy from a branch" → ветка gh-pages, папка / (root).
# Если переключить Source на "GitHub Actions", этот workflow перестанет
# обновлять сайт — тогда используйте pages-actions.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Подготовить публичную папку
        run: |
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site"
          cp -r dist/. "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
          printf '%s\n' \
            '# Шёпот-Долина — публичная сборка' \
            '' \
            'Ветка gh-pages содержит собранную игру (Three.js + Vite, статика).' \
            'Онлайн: https://rezare777.github.io/Silenc/' \
            'Исходники: https://github.com/REzare777/Silenc (ветка main)' \
            > "$RUNNER_TEMP/site/README.md"

      - name: Опубликовать в ветку gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ветку надо получить именно как удалённую ссылку: иначе checkout
          # не находит origin/gh-pages и публикация молча ничего не делает
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git checkout -B gh-pages refs/remotes/origin/gh-pages
          git rm -r --cached . -q || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          git commit -q -m "Публичная сборка ${GITHUB_SHA::7}" || echo "изменений нет"
          # пушить явно: так не зависит от того, как настроен checkout
          git push origin HEAD:gh-pages

      - name: Итог
        run: |
          echo "Сайт опубликован: https://rezare777.github.io/Silenc/"
